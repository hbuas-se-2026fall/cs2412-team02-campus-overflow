# CampusOverflow 持续集成流水线
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -DskipTests

      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipTests -Djacoco.skip=true -Darchitecture.skip=true

      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -DskipTests -Dsurefire.skip=true -Darchitecture.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .

      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
