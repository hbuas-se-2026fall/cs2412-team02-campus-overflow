name: CI

on:
  pull_request:
  push:

env:
  SPRINT_MODULES: "co-shared-kernel,co-identity,co-qa,co-reputation"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 运行指定模块测试（Sprint2允许失败）
        run: |
          mvn test -pl ${SPRINT_MODULES} -am
        continue-on-error: true

      - name: 归档测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            backend/**/target/surefire-reports/

  frontend-check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 全局安装pnpm
        run: npm install -g pnpm

      - name: 安装前端依赖(pnpm)
        run: pnpm install

      - name: TS全量类型检查（Lab5必须全绿，禁止跳过）
        run: pnpm typecheck

      - name: Vite生产构建
        run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
